<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Web Voice Player</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #121212; color: white; }
        button { padding: 20px 40px; font-size: 20px; cursor: pointer; border-radius: 50px; border: none; background: #1DB954; color: white; font-weight: bold; }
        #status { margin-top: 20px; font-size: 1.2em; }
    </style>
</head>
<body>

    <h1>Diga: "Tocar [Nome da Música]"</h1>
    <button id="btnStart">🎤 Falar</button>
    <p id="status">Clique no botão e peça uma música...</p>
    <audio id="musicPlayer" controls style="display:none;"></audio>

    <script>
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        const player = document.getElementById('musicPlayer');
        const status = document.getElementById('status');
        
        recognition.lang = 'pt-BR';

        document.getElementById('btnStart').onclick = () => recognition.start();

        recognition.onresult = async (event) => {
            const comando = event.results[0][0].transcript.toLowerCase();
            
            if (comando.includes("tocar")) {
                const termoBusca = comando.replace("tocar", "").trim();
                status.innerText = "Buscando por: " + termoBusca + "...";
                
                // Busca na API da Deezer
                try {
                    const response = await fetch(`https://api.deezer.com/search?q=${termoBusca}&limit=1`);
                    const data = await response.json();
                    
                    if (data.data.length > 0) {
                        const musica = data.data[0];
                        player.src = musica.preview; // A API da Deezer fornece um trecho de 30s
                        player.style.display = "block";
                        player.play();
                        status.innerText = "Tocando: " + musica.title + " - " + musica.artist.name;
                    } else {
                        status.innerText = "Não encontrei essa música.";
                    }
                } catch (e) {
                    status.innerText = "Erro ao conectar com a API.";
                }
            }
        };
    </script>
</body>
</html>
