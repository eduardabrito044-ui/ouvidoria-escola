<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minha Alexa Web</title>
    <style>
        body { background: #000; color: #0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: monospace; }
        #btnAtivar { padding: 30px; font-size: 20px; border-radius: 50px; background: #0f0; cursor: pointer; }
    </style>
</head>
<body>

    <button id="btnAtivar">Tocar Música (Ativar Modo Voz)</button>
    <p id="status">Status: Aguardando comando...</p>
    <audio id="player" controls style="display:none;"></audio>

    <script>
        const player = document.getElementById('player');
        const status = document.getElementById('status');
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        
        recognition.lang = 'pt-BR';
        recognition.continuous = true; // Mantém ouvindo

        // 1. Destravar áudio no primeiro clique
        document.getElementById('btnAtivar').onclick = () => {
            player.play().then(() => {
                player.pause();
                status.innerText = "Modo Alexa Ativado. Pode falar!";
                recognition.start();
            });
        };

        // 2. Ouvir e Responder
        recognition.onresult = async (event) => {
            const fala = event.results[event.results.length - 1][0].transcript.toLowerCase();
            
            if (fala.includes("tocar")) {
                const musica = fala.replace("tocar", "").trim();
                status.innerText = "Buscando " + musica + "...";
                
                // Responder via voz
                const msg = new SpeechSynthesisUtterance("Claro, tocando " + musica);
                window.speechSynthesis.speak(msg);

                // Buscar música
                const apiURL = `https://api.allorigins.win/get?url=${encodeURIComponent('https://api.deezer.com/search?q=' + musica + '&limit=1')}`;
                const res = await fetch(apiURL);
                const data = JSON.parse((await res.json()).contents);
                
                if (data.data.length > 0) {
                    player.src = data.data[0].preview;
                    player.play();
                }
            }
        };
    </script>
</body>
</html>
